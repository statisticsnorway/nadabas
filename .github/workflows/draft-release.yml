name: Prepare release draft

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release-draft:
    name: Create a draft after a release PR is merged
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release_')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Read and validate the NADABAS version
        id: version
        shell: bash
        run: |
          version="$(
            sed -n 's/\r$//; s/^Private Const CURRENT_VERSION As String = "\([0-9][0-9.]*\)"$/\1/p' \
              vba/modules/InterfaceVersionUpdate.bas
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a valid CURRENT_VERSION from InterfaceVersionUpdate.bas."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: NADABAS ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            --draft
