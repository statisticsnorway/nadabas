name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
      - creation

jobs:
  vba-security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run VBA security scanner
        run: |
          python tools/scan_vba_security.py vba